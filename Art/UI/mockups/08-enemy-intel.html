<!doctype html><meta charset="utf-8"><title>Enemy intel: the Machine thinks</title><link rel="stylesheet" href="hud.css">
<body><div class="stage"></div><script src="hud.js"></script><script>

const H = HUD;
const mslot = (i, seen) => '<div class="slot m ' + (seen ? '' : 'unknown') + '" style="width:75px"><span class="idx">' + (i+1) + '</span>' + (seen ? '<div class="pic"><img src="'+H.unitPic('Frontline','Machine')+'"></div>' : '<div class="dash" style="position:absolute;inset:-3px;border:1px dashed #2e5566"></div><span class="q">?</span>') + '<div class="hp"><i style="width:' + (seen ? [100,100,72][i] : 0) + '%;--hc:var(--bad)"></i></div></div>';
const head = H.header('BARRACKS · FINE-TUNING FARM', '<i class="lens" style="width:9px;height:9px"></i><span>The Machine  ·  scouted 12s ago</span>', { machine:true, hp:[500,500], hpc:'var(--lens)',
  pill:'<span class="pill" style="--pc:var(--cyan)">'+H.g('lock','font-size:10px')+'LOCKED</span><span class="pill" style="--pc:var(--r-frontline)">'+H.g('role_frontline','font-size:11px')+'FRONTLINE</span>' });
const body = '<div class="row" style="gap:12px;align-items:flex-start"><div class="col" style="width:112px;align-items:center;gap:2px"><div class="pframe machine" style="width:112px;height:112px"><img src="'+H.barracksPic('Frontline','Machine')+'"></div><div class="row" style="gap:6px;align-items:baseline;margin-top:2px"><span class="h3" style="color:#7fa7b7">SEEN</span><span class="big" style="font-size:19px;color:var(--pearl)">3<span style="color:#4d6d7d;font-size:14px"> / 6</span></span></div></div>'
 + '<div class="col" style="flex:1;gap:4px"><div class="row" style="height:12px"><span class="h3" style="color:#7fa7b7">ROSTER  ·  SOL 6000 ×6</span><span class="sp"></span><span class="mono" style="font-size:9.5px;color:#5f8595">estimate from last sighting</span></div>'
 + '<div class="row" style="gap:6px">' + [0,1,2,3,4,5].map(i => mslot(i, i < 3)).join('') + '</div>'
 + '<div class="kv" style="margin-top:8px"><span class="k" style="color:#7fa7b7">INTEL</span><span class="muted">Force type is permanent. Front and exact strength unknown.</span></div></div></div>';
const cardHtml = H.card([null,null,null,null,null,null,null,null,null,null,null,null], '', true).replace('<div class="card-grid"', '<div class="abs col" style="left:0;right:0;top:44px;align-items:center;gap:8px;z-index:2"><span style="width:38px;height:38px;color:#3f6a7c;font-size:38px">' + H.g('lock') + '</span><span class="mono" style="font-size:10.5px;color:#7fa7b7">No command access</span><span class="mono" style="font-size:9.5px;color:#4f7080">enemy building</span></div><div class="card-grid"');
const log = ['Thinking… Coverage looks thin at the front. Queuing three SOL 6000.'];
H.mount(
  H.top({ power:960, income:16, sectors:['established','captured','neutral'], secured:1, army:'11 units · 2 forces', spec:'None', team:['C1'], bunker:[900,900], cluster:[900,900] })
  + H.intelPanel({ log, now:'Requesting a Fine-Tuning Farm. Approved. By me.', plan:'ESTABLISH BASE', secs:9, left:990, w:402, h:182, commit:75, commitText:'commit 9s' })
  + H.minimap({ dots:[[40,110,'#4da3ff'],[130,60,'#ff5c4d'],[138,66,'#ff5c4d']], sectors:[['30','118','var(--team-1)'],['68','150','var(--amber)'],['120','78','var(--lens)']] })
  + H.construct({ stash:960 })
  + H.info(head + body, { machine:true }) + cardHtml, '../../../Saved/Verification/campus-zero-20260929/shots-v9/v9-machine-hq.png');

</script>
