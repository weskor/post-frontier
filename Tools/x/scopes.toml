"Docs/**" = ["lint"]
"Art/**" = ["lint"]
"Tools/**" = ["tools"]
"x" = ["tools"]
"pyproject.toml" = ["tools"]
"uv.lock" = ["tools"]
"Build/DrawMapLayout.py" = ["maps", "tools"]
