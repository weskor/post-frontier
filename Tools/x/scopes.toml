# Automation maps use the canonical default_map setting when map = "default".
# No legacy scenario is skipped or quarantined.

[scopes.jev-commitment]
kind = "automation"
filter = "CoopRTS.Enemy.Planner.Commitment"
map = "default"

[scopes.jev-escalation]
kind = "automation"
filter = "CoopRTS.Enemy.Planner.Escalation"
map = "default"

[scopes.jev-target-destroyed]
