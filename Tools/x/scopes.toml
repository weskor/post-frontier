# Automation maps use the canonical default_map setting when map = "default".
# No legacy scenario is skipped or quarantined.

[scopes.combat]
kind = "automation"
filter = "CoopRTS.Combat.Encounter"
map = "default"

[scopes.pursuit]
kind = "automation"
filter = "CoopRTS.Combat.Pursuit"
map = "default"

[scopes.build-bar]
kind = "automation"
filter = "CoopRTS.HUD.BuildBar"
map = "default"

[scopes.construction]
kind = "automation"
filter = "CoopRTS.Construction.Lifecycle"
map = "default"

[scopes.defend-posts-boot]
kind = "automation"
filter = "CoopRTS.Map.DefendPosts"
map = "/Game/Maps/Boot"

[scopes.defend-posts-v2]
kind = "automation"
filter = "CoopRTS.Map.DefendPosts"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.doctrine-frontline]
kind = "automation"
filter = "CoopRTS.Doctrine.EntrenchedFrontline"
map = "default"

[scopes.doctrine-repairs]
kind = "automation"
filter = "CoopRTS.Doctrine.FieldRepairs"
map = "default"

[scopes.doctrine-restart]
kind = "automation"
filter = "CoopRTS.Doctrine.Restart"
map = "default"

[scopes.doctrine-siege]
kind = "automation"
filter = "CoopRTS.Doctrine.SiegeOptics"
map = "default"

[scopes.force-identity]
kind = "automation"
filter = "CoopRTS.Construction.ForceIdentity"
map = "default"

[scopes.force-selection]
kind = "automation"
filter = "CoopRTS.Selection.Forces"
map = "default"

[scopes.goal-orders]
kind = "automation"
filter = "CoopRTS.Construction.GoalOrders"
map = "default"

[scopes.hold-building-edge]
kind = "automation"
filter = "CoopRTS.Hold.BuildingEdge"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.hold-proportional]
kind = "automation"
filter = "CoopRTS.Hold.Proportional"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.hold-border]
kind = "automation"
filter = "CoopRTS.Hold.Border"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.hold-timers]
kind = "automation"
filter = "CoopRTS.Hold.Timers"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.hold-shared-commanders]
kind = "automation"
filter = "CoopRTS.Hold.SharedCommanders"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.hold-jev]
kind = "automation"
filter = "CoopRTS.Hold.Jev"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.jev-scaling]
kind = "automation"
filter = "CoopRTS.Economy.JevScaling"
map = "default"

[scopes.match-loss]
kind = "automation"
filter = "CoopRTS.Match.DefeatRestart"
map = "default"

[scopes.match-win]
kind = "automation"
filter = "CoopRTS.Match.VictoryRestart"
map = "default"

[scopes.movement]
kind = "automation"
filter = "CoopRTS.Movement.TwoGroups"
map = "default"

[scopes.objective-events]
kind = "automation"
filter = "CoopRTS.Objectives.Events"
map = "default"

[scopes.objective-assets]
kind = "automation"
filter = "CoopRTS.Objectives.Assets"
map = "default"

[scopes.orders]
kind = "automation"
filter = "CoopRTS.Orders.ReplaceHoldRetreat"
map = "default"

[scopes.production]
kind = "automation"
filter = "CoopRTS.Construction.Production"
map = "default"

[scopes.rules]
kind = "automation"
filter = "CoopRTS.Rules"
map = "default"

[scopes.pause]
kind = "automation"
filter = "CoopRTS.Pause"
map = "default"

[scopes.pause-network]
kind = "script"
commands = [
  ["./x", "verify", "network", "--mode", "editor", "--clients", "1", "--scenario", "pause"],
]

[scopes.pings]
kind = "automation"
filter = "CoopRTS.Pings.PlacementExpiry"
map = "default"

[scopes.pings-network]
kind = "script"
commands = [
  ["./x", "verify", "network", "--mode", "editor", "--clients", "1", "--scenario", "pings"],
]

[scopes.strategy]
kind = "automation"
filter = "CoopRTS.Enemy.ConstructionEconomy"
map = "default"

[scopes.simulation-duel]
kind = "automation"
filter = "CoopRTS.Simulation.Duel"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.tools]
kind = "pytest"
paths = ["Tools/tests"]

[scopes.maps]
kind = "script"
commands = [
  ["python3", "Build/DrawMapLayout.py", "--report", "--out", "{run}/AvailabilityZone-layout.png"],
  ["python3", "Build/DrawAvailabilityZoneV2.py", "--out", "{run}/AvailabilityZoneV2-layout.png"],
  ["python3", "Build/AvailabilityZoneLayout.py", "--svg", "{run}/AvailabilityZone-geometry.svg"],
]

[scopes.lint]
kind = "lint"

[paths]
# Root patterns are anchored; * never crosses a directory separator.
"*.md" = ["lint"]
".*" = ["lint"]
".agents/**" = ["lint"]
"Docs/**" = ["lint"]
"Art/**" = ["lint"]
"Tools/**" = ["tools"]
"x" = ["tools"]
"pyproject.toml" = ["tools"]
"uv.lock" = ["tools"]
"Build/DrawMapLayout.py" = ["maps", "tools"]
"Build/DrawAvailabilityZoneV2.py" = ["maps", "tools"]
"Build/AvailabilityZoneLayout.py" = ["maps", "tools"]
"Build/Maps/**" = ["maps", "tools"]
"Build/Audio/**" = ["tools"]
"Build/Maps/AvailabilityZoneV2.json" = ["defend-posts-v2"]
"Build/Generate*.py" = ["lint"]
"Build/GenerateMatchContent.py" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "goal-orders", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "pursuit"]
"Build/Content/**" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "goal-orders", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "pursuit"]
"Build/GenerateCommandMap.py" = ["defend-posts-boot"]
"Build/GenerateAvailabilityZoneV2.py" = ["defend-posts-v2"]
"Build/Import*.py" = ["lint"]
"Build/Build*.py" = ["lint"]
"Build/Fetch*.py" = ["lint"]
"Build/Render*.py" = ["lint"]
"Build/ArtMaterials.py" = ["lint"]
"Build/EnvKit.py" = ["lint"]
"Build/ExportUIAssets.py" = ["lint"]
"Build/MasterMaterials.py" = ["lint"]
"Build/MatchLayout.py" = ["maps", "tools", "defend-posts-boot", "defend-posts-v2"]
"Tools/harness/simulate_matches.py" = ["lint"]
"Build/TerrainKit.py" = ["lint"]
"Build/VerifyMasks.py" = ["lint"]
"Build/*.patch" = ["lint"]
"Build/unit_audio/**" = ["lint"]
"Config/**" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "goal-orders", "jev-scaling", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "simulation-duel", "pursuit"]
"Content/**" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "goal-orders", "jev-scaling", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "simulation-duel", "pursuit"]
"CoopRTS.uproject" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "goal-orders", "jev-scaling", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "simulation-duel", "pursuit"]
"Source/**/*.cs" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "goal-orders", "jev-scaling", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "simulation-duel", "pursuit"]
