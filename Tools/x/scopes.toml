# Automation maps use the canonical default_map setting when map = "default".
# No legacy scenario is skipped or quarantined.

[scopes.combat]
kind = "automation"
filter = "CoopRTS.Combat.Encounter"
map = "default"

[scopes.construction]
kind = "automation"
filter = "CoopRTS.Construction.Lifecycle"
map = "default"

[scopes.doctrine-frontline]
kind = "automation"
filter = "CoopRTS.Doctrine.EntrenchedFrontline"
map = "default"

[scopes.doctrine-repairs]
kind = "automation"
filter = "CoopRTS.Doctrine.FieldRepairs"
map = "default"

[scopes.doctrine-restart]
kind = "automation"
filter = "CoopRTS.Doctrine.Restart"
map = "default"

[scopes.doctrine-siege]
kind = "automation"
filter = "CoopRTS.Doctrine.SiegeOptics"
map = "default"

[scopes.force-identity]
kind = "automation"
filter = "CoopRTS.Construction.ForceIdentity"
map = "default"

[scopes.goal-orders]
kind = "automation"
filter = "CoopRTS.Construction.GoalOrders"
map = "default"

[scopes.match-loss]
kind = "automation"
filter = "CoopRTS.Match.DefeatRestart"
map = "default"

[scopes.match-win]
kind = "automation"
filter = "CoopRTS.Match.VictoryRestart"
map = "default"

[scopes.movement]
kind = "automation"
filter = "CoopRTS.Movement.TwoGroups"
map = "default"

[scopes.orders]
kind = "automation"
filter = "CoopRTS.Orders.ReplaceHoldRetreat"
map = "default"

[scopes.production]
kind = "automation"
filter = "CoopRTS.Construction.Production"
map = "default"

[scopes.rules]
kind = "automation"
filter = "CoopRTS.Rules"
map = "default"

[scopes.strategy]
kind = "automation"
filter = "CoopRTS.Enemy.ConstructionEconomy"
map = "default"

[scopes.tools]
kind = "pytest"
paths = ["Tools/tests"]

[scopes.maps]
kind = "script"
commands = [
  ["python3", "Build/DrawMapLayout.py", "--report", "--out", "{run}/AvailabilityZone-layout.png"],
  ["python3", "Build/DrawAvailabilityZoneV2.py", "--out", "{run}/AvailabilityZoneV2-layout.png"],
  ["python3", "Build/AvailabilityZoneLayout.py", "--svg", "{run}/AvailabilityZone-geometry.svg"],
]

[scopes.lint]
kind = "lint"

[paths]
# Root patterns are anchored; * never crosses a directory separator.
"*.md" = ["lint"]
".*" = ["lint"]
".agents/**" = ["lint"]
".omp/**" = ["lint"]
"Docs/**" = ["lint"]
"Art/**" = ["lint"]
"Tools/**" = ["tools"]
"x" = ["tools"]
"pyproject.toml" = ["tools"]
"uv.lock" = ["tools"]
"Build/DrawMapLayout.py" = ["maps"]
"Build/DrawAvailabilityZoneV2.py" = ["maps"]
"Build/AvailabilityZoneLayout.py" = ["maps"]
"Build/Maps/**" = ["maps"]
"Build/Generate*.py" = ["lint"]
"Build/Import*.py" = ["lint"]
"Build/Build*.py" = ["lint"]
"Build/Fetch*.py" = ["lint"]
"Build/Render*.py" = ["lint"]
"Build/ArtMaterials.py" = ["lint"]
"Build/EnvKit.py" = ["lint"]
