[scopes.pause]
kind = "automation"
filter = "CoopRTS.Pause"
map = "default"

[scopes.pause-network]
kind = "script"
commands = [
  ["./x", "verify", "network", "--mode", "editor", "--clients", "1", "--scenario", "pause"],
]

[scopes.pings]
kind = "automation"
filter = "CoopRTS.Pings.PlacementExpiry"
map = "default"

[scopes.pings-network]
kind = "script"
commands = [
  ["./x", "verify", "network", "--mode", "editor", "--clients", "1", "--scenario", "pings"],
]

[scopes.strategy]
kind = "automation"
filter = "CoopRTS.Enemy.ConstructionEconomy"
map = "default"

[scopes.jev-memos]
kind = "automation"
filter = "CoopRTS.Jev.MemoData"
map = "default"

[scopes.jev-intent-ui]
kind = "automation"
filter = "CoopRTS.HUD.JevIntent"
map = "default"

[scopes.simulation-duel]
kind = "automation"
filter = "CoopRTS.Simulation.Duel"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.tools]
kind = "pytest"
paths = ["Tools/tests"]

[scopes.maps]
kind = "script"
commands = [
  ["python3", "Build/DrawMapLayout.py", "--report", "--out", "{run}/AvailabilityZone-layout.png"],
  ["python3", "Build/DrawAvailabilityZoneV2.py", "--out", "{run}/AvailabilityZoneV2-layout.png"],
  ["python3", "Build/AvailabilityZoneLayout.py", "--svg", "{run}/AvailabilityZone-geometry.svg"],
]

[scopes.telemetry]
kind = "automation"
filter = "CoopRTS.Telemetry.Match"
map = "/Game/Maps/AvailabilityZoneV2"

[scopes.lint]
kind = "lint"

[scopes.force-bar]
kind = "automation"
filter = "CoopRTS.HUD.ForceBar"
map = "default"
rendered = true

[paths]
# Root patterns are anchored; * never crosses a directory separator.
"*.md" = ["lint"]
".*" = ["lint"]
".agents/**" = ["lint"]
"Docs/**" = ["lint"]
"Art/**" = ["lint"]
"Tools/**" = ["tools"]
"x" = ["tools"]
"pyproject.toml" = ["tools"]
"uv.lock" = ["tools"]
"Build/DrawMapLayout.py" = ["maps", "tools"]
"Build/DrawAvailabilityZoneV2.py" = ["maps", "tools"]
"Build/AvailabilityZoneLayout.py" = ["maps", "tools"]
"Build/Maps/**" = ["maps", "tools"]
"Build/Audio/**" = ["tools"]
"Build/Maps/AvailabilityZoneV2.json" = ["defend-posts-v2"]
"Build/Generate*.py" = ["lint"]
"Build/GenerateMatchContent.py" = ["combat", "construction", "doctrine-frontline", "doctrine-repairs", "doctrine-restart", "doctrine-siege", "force-identity", "force-move-hold", "force-attack-withdrawal", "force-structure-death", "force-retreat", "force-orphan", "force-queue", "force-mixed-speed", "force-rally", "force-threshold-never", "force-no-safe-fallback", "match-loss", "match-win", "movement", "orders", "production", "rules", "strategy", "pursuit"]
