# Every rule is blocking; scopes grow only when an entire folder is clean.
# Path globs: * matches one component; ** crosses directories.
# Build Python lint/types await their own migration slice.
# Docs/Engineering/Audit is frozen measured evidence: both doc rules stay off.
[rules]
suppression = ["**/*.h", "**/*.cpp", "**/*.cs", "**/*.py", "**/*.c", "x"]
disabled-test = ["**/*.h", "**/*.cpp", "**/*.cs", "**/*.py", "**/*.c", "x"]
marker = ["**/*.h", "**/*.cpp", "**/*.cs", "**/*.py", "**/*.c", "x"]
# Build and the legacy verification scripts still name direct engine commands.
direct-engine = ["Source/**", "Tools/**", "Build/unit_audio/**", "x"]
# Research/input-audit still cites untracked evidence; Research stays off here.
saved-path = ["Docs/Design/**", "Docs/Design.md", "AGENTS.md", "Art/Textures/**", ".agents/skills/orchestrate/**"]
# Root Engineering files are clean; Audit is deliberately not included.
procedure-text = ["Docs/Design/**", "Docs/Design.md", "Docs/Research/**", "Docs/Engineering/*.md", "Art/Materials/**"]
rules-includes = ["Source/CoopRTS/Rules/**"]
scope-map = ["**"]
file-length = ["Source/CoopRTS/Rules/**", "Source/CoopRTS/Content/**", "Tools/x/**", "Tools/tests/**", "x"]
function-length = ["Source/CoopRTS/Rules/**", "Source/CoopRTS/Content/**", "Tools/x/**", "Tools/tests/**", "x"]
format = ["Source/**/*.h", "Source/**/*.cpp", "Tools/x/**/*.py", "Tools/tests/**/*.py", "Tools/harness/**/*.py", "x"]
ruff = ["Tools/x/**/*.py", "Tools/tests/**/*.py", "Tools/harness/**/*.py", "x"]
mypy = ["Tools/x/**/*.py", "Tools/tests/**/*.py", "Tools/harness/**/*.py", "x"]
