# Every rule is blocking; scopes grow only when an entire folder is clean.
# Path globs: * matches one component; ** crosses directories; ! excludes a path.
# Docs/Engineering/Audit is frozen measured evidence: both doc rules and land-bypass stay off.
[rules]
suppression = ["**/*.h", "**/*.cpp", "**/*.cs", "**/*.py", "**/*.c", "x"]
disabled-test = ["**/*.h", "**/*.cpp", "**/*.cs", "**/*.py", "**/*.c", "x"]
marker = ["**/*.h", "**/*.cpp", "**/*.cs", "**/*.py", "**/*.c", "x"]
land-bypass = [
    "**", "!Docs/Engineering/Audit/**", "!Tools/hooks/**", "!Tools/x/landing.py",
    "!Tools/tests/test_land.py", "!Tools/tests/test_land_hooks.py",
    "!Tools/tests/test_land_lock.py", "!Tools/tests/test_land_strict.py",
    "!Tools/tests/test_land_bypass.py", "!Tools/tests/landing_support.py",
    "!Tools/tests/test_land_audit.py",
]
# Build and the legacy verification scripts still name direct engine commands.
direct-engine = [
    "Source/**", "Tools/**", "Build/unit_audio/**", "x",
    "Build/ArtMaterials.py", "Build/AvailabilityZoneLayout.py",
    "Build/DrawAvailabilityZoneV2.py", "Build/DrawMapLayout.py", "Build/EnvKit.py",
    "Build/ExportUIAssets.py", "Build/FetchAudioSources.py", "Build/FetchTextures.py",
    "Build/GenerateBuildingMeshes.py", "Build/GenerateEnvironmentKit.py",
    "Build/GenerateMenuMap.py", "Build/GenerateMusicSample.py",
    "Build/GenerateOverlayMaterials.py", "Build/GenerateTerrainKit.py",
    "Build/GenerateUnitAudio.py", "Build/GenerateUnitMeshes.py",
    "Build/RenderAnnouncerVoice.py",
    "Build/MasterMaterials.py", "Build/MatchLayout.py",
    "Build/RenderTextureContactSheet.py", "Build/RenderUIIcons.py", "Build/TerrainKit.py",
]
# Pipeline/reference docs link to ./x help.
saved-path = [
    "Docs/Design/**", "Docs/Design.md", "AGENTS.md", "Art/Textures/**", ".agents/skills/orchestrate/**",
    "README.md", "Docs/Engineering/*.md",
    "Docs/World.md", "Docs/Balance.md", "Docs/Audio.md",
    "Docs/Maps/AvailabilityZone.md", "Docs/Maps/AvailabilityZone-implementation.md", "Docs/Maps/AvailabilityZoneV2.md",
    "Docs/Research/**", "Art/Audio/SOURCES.md", "Art/Materials/UNREAL.md",
    "Art/UI/IMPLEMENTATION.md", "Art/UI/STYLE.md",
]
# Root Engineering files are clean; Audit is deliberately not included.
procedure-text = [
    "Docs/Design/**", "Docs/Design.md", "Docs/Research/**", "Docs/Engineering/*.md", "Art/Materials/**",
    "README.md", "AGENTS.md", ".agents/skills/orchestrate/**",
    "Docs/World.md", "Docs/Balance.md", "Docs/Audio.md",
    "Docs/Maps/AvailabilityZone.md", "Docs/Maps/AvailabilityZone-implementation.md", "Docs/Maps/AvailabilityZoneV2.md",
    "Art/Audio/SOURCES.md", "Art/Textures/SOURCES.md", "Art/UI/IMPLEMENTATION.md", "Art/UI/STYLE.md",
]
rules-includes = ["Source/CoopRTS/Rules/**"]
scope-map = ["**"]
file-length = [
    "Source/CoopRTS/HUD/**", "Source/CoopRTS/CommandHUD.*",
    "Source/CoopRTS/Rules/**", "Source/CoopRTS/Content/**", "Tools/x/**", "Tools/tests/**", "x",
    "Source/CoopRTS/ObjectiveAnnouncer.*",
    "Tools/harness/network.py", "Tools/harness/network_cli.py", "Tools/harness/network_economy.py",
    "Tools/harness/network_outcomes.py", "Tools/harness/network_ownership.py", "Tools/harness/network_peers.py",
    "Tools/harness/network_probe.py", "Tools/harness/network_production.py",
    "Tools/harness/network_scenarios.py", "Tools/harness/network_session.py",
    "Tools/harness/simulate_matches.py", "Tools/harness/simulation_*.py",
    "Tools/harness/hud_*.py", "Tools/harness/verify.py", "Tools/harness/network_desktop.py",
    "Tools/harness/verification_readiness.py",
]
function-length = [
    "Source/CoopRTS/HUD/**", "Source/CoopRTS/CommandHUD.*",
    "Source/CoopRTS/Rules/**", "Source/CoopRTS/Content/**", "Tools/x/**", "Tools/tests/**", "x",
    "Source/CoopRTS/ObjectiveAnnouncer.*",
    "Tools/harness/network.py", "Tools/harness/network_cli.py", "Tools/harness/network_economy.py",
    "Tools/harness/network_outcomes.py", "Tools/harness/network_ownership.py", "Tools/harness/network_peers.py",
    "Tools/harness/network_probe.py", "Tools/harness/network_production.py",
    "Tools/harness/network_scenarios.py", "Tools/harness/network_session.py",
    "Tools/harness/simulate_matches.py", "Tools/harness/simulation_*.py",
    "Tools/harness/hud_*.py", "Tools/harness/verification_readiness.py",
]
format = [
    "Source/**/*.h", "Source/**/*.cpp", "Tools/x/**/*.py", "Tools/tests/**/*.py", "Tools/harness/**/*.py", "x",
    "Build/DrawMapLayout.py", "Build/AvailabilityZoneLayout.py",
    "Build/DrawAvailabilityZoneV2.py", "Build/FetchTextures.py",
    "Build/FetchAudioSources.py", "Build/GenerateMusicSample.py",
    "Build/GenerateUnitAudio.py", "Build/ExportUIAssets.py", "Build/unit_audio/**/*.py",
    "Build/RenderAnnouncerVoice.py",
]
ruff = [
    "Tools/x/**/*.py", "Tools/tests/**/*.py", "Tools/harness/**/*.py", "x",
    "Build/DrawMapLayout.py", "Build/AvailabilityZoneLayout.py",
    "Build/DrawAvailabilityZoneV2.py", "Build/FetchTextures.py",
    "Build/FetchAudioSources.py", "Build/GenerateMusicSample.py",
    "Build/GenerateUnitAudio.py", "Build/ExportUIAssets.py", "Build/unit_audio/**/*.py",
    "Build/RenderAnnouncerVoice.py",
]
mypy = [
    "Tools/x/**/*.py", "Tools/tests/**/*.py", "Tools/harness/**/*.py", "x",
    "Build/DrawMapLayout.py", "Build/AvailabilityZoneLayout.py",
    "Build/DrawAvailabilityZoneV2.py", "Build/FetchTextures.py",
    "Build/FetchAudioSources.py", "Build/GenerateMusicSample.py",
    "Build/GenerateUnitAudio.py", "Build/ExportUIAssets.py", "Build/unit_audio/**/*.py",
    "Build/RenderAnnouncerVoice.py",
]

# These modules are imported by Unreal's embedded Python, not only by ./x.
[python]
version = "3.11"
paths = ["Build/DrawMapLayout.py", "Build/AvailabilityZoneLayout.py"]
