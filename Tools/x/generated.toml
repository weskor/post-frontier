sources = [
  "Build/ImportEnvironmentKit.py",
  "Build/EnvKit.py",
  "Build/ArtMaterials.py",
  "Art/Environment/*.fbx",
]
outputs = ["Content/Art/Environment/**"]

[[generated]]
name = "terrain-kit"
