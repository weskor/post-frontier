  "Build/MatchLayout.py",
  "Build/ArtMaterials.py",
  "Build/ContentText.py",
  "Build/Content/constants.json",
  "Build/Maps/AvailabilityZone.json",
  "Art/Terrain/*.fbx",
]
outputs = [
  "Content/Art/Terrain/**",
  "Content/Art/Materials/MI_SC2_Human_Dark_Terrain.uasset",
  "Content/Art/Materials/MI_SC2_Human_Dark_Rock.uasset",
  "Content/Art/Materials/MI_SC2_Human_Shell_Rock.uasset",
]

[[generated]]
