# Source-to-output map for generated binary assets (`.uasset`/`.umap`).
#
# Agents change the text sources; `./x land` regenerates the outputs of every
# entry whose `sources` changed on the branch and commits them in a separate
# commit. The pre-commit hook rejects any other commit that changes an output.
#
# [[generated]]  name     unique id, printed by land
#                gen      `./x gen` entries run in this order (de-duplicated across entries)
#                sources  repo-relative globs; a branch change to any of them triggers regeneration
#                outputs  repo-relative globs of the files the gens write; every tracked
#                         binary must match exactly one entry (`generated` or `authored`)
# [[authored]]   name, reason, paths: hand-authored binaries with no generator; commits may change them
#
# Globs are anchored: `*` and `?` stay inside a directory, `**` crosses directories.
# Entries run in file order, so an entry that needs another's outputs comes after it.
# Blender and REAPER outputs (`Art/**/*.fbx`, `Art/Audio/**/*.wav`) are sources here:
# they are produced by manual `./x gen` runs and imported by the entries below.

[[generated]]
name = "match-content"
gen = ["generate-match-content"]
sources = ["Build/GenerateMatchContent.py", "Build/ContentText.py", "Build/Content/**"]
outputs = ["Content/Units/**", "Content/Content/**"]

[[generated]]
name = "shared-material"
gen = ["build-shared-material"]
sources = ["Build/BuildSharedMaterial.py", "Build/ArtMaterials.py", "Art/Textures/**/*.jpg"]
outputs = [
  "Content/Art/Textures/**",
  "Content/Art/Materials/M_Shared.uasset",
  "Content/Art/Materials/MF_*.uasset",
  "Content/Art/Materials/MI_SC2_*_Unit.uasset",
  "Content/Art/Materials/MI_SC2_*_Bld.uasset",
  "Content/Art/Materials/MI_SC2_*_Env.uasset",
]

[[generated]]
name = "unit-meshes"
gen = ["import-unit-meshes"]
sources = ["Build/ImportUnitMeshes.py", "Build/ArtMaterials.py", "Art/Units/*.fbx"]
outputs = ["Content/Art/Units/**", "Content/Maps/UnitGallery.umap", "Content/Art/Materials/MI_GalleryFloor.uasset"]

[[generated]]
name = "building-meshes"
gen = ["import-building-meshes"]
sources = ["Build/ImportBuildingMeshes.py", "Build/ArtMaterials.py", "Art/Buildings/*.fbx"]
outputs = ["Content/Art/Buildings/**"]

[[generated]]
name = "environment-kit"
